# ============================================================
# Centralized configuration - Llama.cpp server
# Edit here to change model, port, threads, etc.
# ============================================================

# Binary path
BIN="/usr/bin/llama-server"

# Shared libraries
LD_LIB="/usr/bin"

# Folder containing .gguf models
MODEL_DIR="/opt/llamacpp-launcher/models"

# Default model (loaded if none selected)
DEFAULT_MODEL="/opt/llamacpp-launcher/models/Unsloth_Qwen3-14B-128K-Q4_K_M.gguf"

# Server settings
CTX_SIZE="16384"
NGPU_LAYERS="all"
THREADS="6"
THREADS_BATCH="12"
FLASH_ATTN="on"
BATCH_SIZE="1024"
UBATCH_SIZE="256"
PARALLEL="1"
HOST="127.0.0.1"
PORT="9931"

# Runtime files
PID_FILE="/tmp/llama-server.pid"
LOG_FILE="/opt/llamacpp-launcher/llama-server.log"
CONFIG_FILE="/opt/llamacpp-launcher/current_model.txt"
