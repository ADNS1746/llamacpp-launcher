# ============================================================
# Configuration centralisée - Serveur llama.cpp
# Modifiez ici pour changer modèle, port, threads, etc.
# ============================================================

# Chemin du binaire
BIN="/usr/bin/llama-server"

# Bibliothèques partagées
LD_LIB="/usr/bin"

# Dossier contenant les modèles .gguf
MODEL_DIR="/opt/llamacpp-launcher/models"

# Modèle par défaut (démarrage si aucun sélectionné)
DEFAULT_MODEL="/opt/llamacpp-launcher/models/Unsloth_Qwen3-14B-128K-Q4_K_M.gguf"

# Paramètres du serveur
CTX_SIZE="16384"
NGPU_LAYERS="all"
THREADS="6"
THREADS_BATCH="12"
FLASH_ATTN="on"
BATCH_SIZE="1024"
UBATCH_SIZE="256"
PARALLEL="1"
HOST="0.0.0.0"
PORT="8080"

# Fichiers de runtime
PID_FILE="/tmp/llama-server.pid"
LOG_FILE="/opt/llamacpp-launcher/llama-server.log"
CONFIG_FILE="/opt/llamacpp-launcher/current_model.txt"
