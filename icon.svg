<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="adnsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="1.5"/>

  <g transform="translate(64, 64)" filter="url(#glow)">
    <path d="M-28,-14 L28,-14 L38,0 L28,14 L-28,14 L-38,0 Z" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="1.5" stroke-linejoin="round"/>
    <g fill="none" stroke="url(#accentGrad)" stroke-width="1.2" stroke-linecap="round">
      <line x1="-20" y1="-8" x2="20" y2="-8" opacity="0.6"/>
      <line x1="-20" y1="0" x2="20" y2="0" opacity="0.8"/>
      <line x1="-20" y1="8" x2="20" y2="8" opacity="0.6"/>
    </g>
    <circle cx="0" cy="0" r="6" fill="url(#accentGrad)" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <rect x="-34" y="-10" width="8" height="20" rx="1" fill="#1e293b" stroke="#3b82f6" stroke-width="1" opacity="0.7"/>
    <rect x="26" y="-10" width="8" height="20" rx="1" fill="#1e293b" stroke="#06b6d4" stroke-width="1" opacity="0.7"/>
  </g>

  <!-- LL : haut du logo, même gradient que le logo -->
  <text x="64" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="url(#accentGrad)" text-anchor="middle" letter-spacing="2">LL</text>

  <!-- launcher : même gradient, juste en dessous -->
  <text x="64" y="44" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="url(#accentGrad)" text-anchor="middle" letter-spacing="3">launcher</text>

  <!-- ADNS : bas du logo, autre gradient (orange) -->
  <text x="64" y="102" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="url(#adnsGrad)" text-anchor="middle" letter-spacing="5" opacity="0.85">ADNS</text>
</svg>