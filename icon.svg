<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" aria-label="Llama Server">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1a3a6e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background circle (GNOME style) -->
  <circle cx="24" cy="24" r="22" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Llama head profile - modern flat design -->
  <g fill="#fdf6e3" stroke="#3a3220" stroke-width="1.2" stroke-linejoin="round">
    <!-- Main head body -->
    <ellipse cx="22" cy="28" rx="7" ry="6"/>
    <!-- Neck -->
    <rect x="18" y="32" width="6" height="4" rx="1"/>
    <!-- Snout -->
    <ellipse cx="26" cy="30" rx="3.5" ry="2.5" transform="rotate(-15 26 30)" fill="#e8cfab"/>
    <!-- Ear left -->
    <polygon points="16,22 14,16 18,20" fill="#fdf6e3"/>
    <polygon points="16,22 14,16 18,20" fill="none"/>
    <!-- Ear right -->
    <polygon points="26,22 28,16 24,20" fill="#fdf6e3"/>
    <!-- Eye left -->
    <circle cx="20" cy="27" r="1.2" fill="#2a2a2a"/>
    <circle cx="20.3" cy="26.7" r="0.3" fill="#fff"/>
    <!-- Eye right -->
    <circle cx="24" cy="27" r="1.2" fill="#2a2a2a"/>
    <circle cx="24.3" cy="26.7" r="0.3" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="28" cy="31" rx="0.8" ry="0.5" fill="#a08060"/>
  </g>

  <!-- Server / connection dots -->
  <g fill="#e66100">
    <circle cx="36" cy="30" r="1.8"/>
    <circle cx="39" cy="34" r="1.2"/>
    <circle cx="35" cy="35" r="0.8"/>
  </g>

  <!-- Connection line -->
  <line x1="26" y1="30" x2="34" y2="30" stroke="#e66100" stroke-width="2" stroke-linecap="round"/>

  <text x="24" y="12" font-family="sans-serif" font-size="9" font-weight="bold" fill="#fff" text-anchor="middle" letter-spacing="0.5">LLAMA</text>
</svg>